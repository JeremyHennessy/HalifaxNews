name: Verify HRFE live adapter

on:
  push:
    branches: [fix/hrfe-live-parser]
    paths:
      - "hfxpulse/adapters/hrfe.py"
      - "tests/**"
      - ".github/workflows/diagnose-hrfe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify live HRFE adapter
        run: |
          python - <<'PY'
          from hfxpulse.adapters.hrfe import fetch

          result = fetch()
          health = result.health
          print('status:', health.status if health else None)
          print('records:', len(result.incidents))
          print('error:', health.error if health else None)
          assert health is not None
          assert health.status == 'ok', health.error
          assert len(result.incidents) > 0
          first = result.incidents[0]
          print('first_id:', first.id)
          print('first_title:', first.title)
          print('first_location:', first.location_text)
          print('first_reported_at:', first.reported_at)
          print('first_response:', first.metadata.get('response'))
          PY
