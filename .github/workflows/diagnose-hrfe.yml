name: Diagnose HRFE live source

on:
  push:
    branches: [fix/hrfe-live-parser]
    paths: [".github/workflows/diagnose-hrfe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect public HRFE page structure
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          url = 'https://www.halifax.ca/safety-security/fire-emergency/hrfe-incident-feed'
          r = requests.get(url, timeout=25, headers={'User-Agent':'HFXPulse/1.0 (+https://github.com/JeremyHennessy/HalifaxNews)'})
          print('status:', r.status_code)
          print('final_url:', r.url)
          print('content_type:', r.headers.get('content-type'))
          print('bytes:', len(r.content))
          soup = BeautifulSoup(r.text, 'html.parser')
          print('title:', soup.title.get_text(' ', strip=True) if soup.title else None)
          text = soup.get_text(' ', strip=True)
          print('text_chars:', len(text))
          print('has_call_number:', 'Call Number:' in text)
          print('has_hf26:', bool(re.search(r'HF26\d+', text, re.I)))
          print('TEXT_SAMPLE_START')
          print(text[:3500])
          print('TEXT_SAMPLE_END')
          print('IFRAMES')
          for x in soup.find_all('iframe'):
              print(x.get('src'))
          print('CANDIDATE_LINKS')
          seen=set()
          for tag in soup.find_all(['a','link','script']):
              target = tag.get('href') or tag.get('src') or ''
              label = tag.get_text(' ', strip=True)
              blob = f'{target} {label}'.lower()
              if any(k in blob for k in ('incident','feed','rss','json','fire','emergency')) and target not in seen:
                  seen.add(target)
                  print(target, '|', label[:120])
          print('HTML_MATCHES')
          for m in re.findall(r'.{0,160}(?:incident|rss|feed|HF26\d+|iframe|json).{0,260}', r.text, flags=re.I):
              print(re.sub(r'\s+', ' ', m)[:500])
          PY
