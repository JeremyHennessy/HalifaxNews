name: Diagnose HRFE live source

on:
  push:
    branches: [fix/hrfe-live-parser]
    paths: [".github/workflows/diagnose-hrfe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official HRFE RSS structure
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from xml.etree import ElementTree as ET

          base = 'https://www.halifax.ca/safety-security/fire-emergency/hrfe-incident-feed'
          headers = {'User-Agent':'HFXPulse/1.0 (+https://github.com/JeremyHennessy/HalifaxNews)'}
          page = requests.get(base, timeout=25, headers=headers)
          page.raise_for_status()
          soup = BeautifulSoup(page.text, 'html.parser')
          alt = soup.find('link', attrs={'rel':'alternate', 'type':'application/rss+xml'})
          rss_url = alt.get('href') if alt else base + '/rss.xml'
          print('rss_url:', rss_url)
          r = requests.get(rss_url, timeout=25, headers=headers)
          print('status:', r.status_code)
          print('content_type:', r.headers.get('content-type'))
          print('bytes:', len(r.content))
          r.raise_for_status()
          root = ET.fromstring(r.content)
          items = root.findall('.//item')
          print('items:', len(items))
          for i, item in enumerate(items[:3]):
              print(f'ITEM_{i}_START')
              for child in list(item):
                  tag = child.tag.split('}')[-1]
                  text = ''.join(child.itertext()).strip()
                  print(tag + ':', text[:1200])
              print(f'ITEM_{i}_END')
          PY
