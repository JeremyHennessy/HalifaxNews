name: Apply broad-source HFX Pulse build

on:
  push:
    branches:
      - build/hfx-pulse-mvp
    paths:
      - '.bootstrap-v2/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: hfx-pulse-bootstrap-v2
  cancel-in-progress: false

jobs:
  expand-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: build/hfx-pulse-mvp
          fetch-depth: 1

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-v2/part-* | base64 --decode > /tmp/hfxpulse-current.tgz
          echo '98122f275a35a4907de49dd8ccaeecb407b3270f5ae840d193bb0507f8734c03  /tmp/hfxpulse-current.tgz' | sha256sum -c -
          tar -tzf /tmp/hfxpulse-current.tgz >/dev/null

      - name: Apply broad-source source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/hfxpulse-current.tgz
          rm -rf .bootstrap-v2
          rm -f .github/workflows/bootstrap.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application source
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q hfxpulse scripts tests
          node --check public/assets/app.js
          python - <<'PY'
          import json
          for path in ('config/sources.json', 'public/data/incidents.json'):
              with open(path, encoding='utf-8') as fh:
                  json.load(fh)
          print('JSON contracts parse')
          PY

      - name: Commit verified broad-source build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 002: broaden HFX Pulse source coverage'
          git push origin HEAD:build/hfx-pulse-mvp
