name: Bootstrap HFX Pulse build

on:
  push:
    branches: [build/hfx-pulse-mvp]
    paths:
      - ".bootstrap/hfx-pulse.tgz.b64"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/hfx-pulse-mvp
      - name: Expand staged source package
        run: |
          base64 --decode .bootstrap/hfx-pulse.tgz.b64 | tar -xzf -
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify application source
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          json.load(open('config/sources.json', encoding='utf-8'))
          json.load(open('public/data/incidents.json', encoding='utf-8'))
          print('JSON validation OK')
          PY
      - name: Commit verified source tree
        run: |
          git config user.name "hfx-pulse-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build 001: HFX Pulse incident intelligence MVP"
          git push origin HEAD:build/hfx-pulse-mvp
