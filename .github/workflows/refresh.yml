name: Refresh incident data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hfxpulse/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"
  schedule:
    # Avoid the top-of-hour peak; Actions schedules still have no latency SLA.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: hfx-pulse-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled events may sit in a queue. Collect with current production code.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect public incident signals
        run: python scripts/collect.py
      - name: Validate parsers and scoring
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed data when changed
        run: |
          git config user.name "hfx-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/incidents.json data/geocode_cache.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "data: refresh Halifax incident signals"
          git pull --rebase
          git push
      - name: Verify the published dataset is current
        run: >-
          python scripts/check_freshness.py
          --expected-file public/data/incidents.json
          --wait-seconds 240
