name: Verify HFX Pulse

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q hfxpulse scripts tests
      - name: JavaScript syntax
        run: node --check public/assets/app.js
      - name: Live source compatibility smoke test
        env:
          HFXPULSE_GEOCODE: "0"
        run: python scripts/collect.py
      - name: Validate generated contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('public/data/incidents.json').read_text())
          assert p['schema_version'] >= 4
          assert isinstance(p['incidents'], list)
          assert isinstance(p['events'], list)
          assert p['event_count'] == len(p['events'])
          assert p['observation_count'] == len(p['incidents'])

          event_ids = [event.get('id') for event in p['events']]
          if len(event_ids) != len(set(event_ids)):
              duplicates = sorted({event_id for event_id in event_ids if event_ids.count(event_id) > 1})
              raise SystemExit(f"Duplicate normalized event IDs: {duplicates[:10]}")

          for event in p['events']:
              assert event['source_count'] >= 1
              assert event['evidence_count'] >= 1
              assert isinstance(event['evidence'], list)
              gtfs_evidence = [
                  row for row in event['evidence']
                  if row.get('source') == 'Halifax Transit GTFS-Realtime'
              ]
              if len(gtfs_evidence) > 1:
                  raise SystemExit(
                      f"Distinct Halifax Transit GTFS alerts were clustered together: {event.get('id')}"
                  )

          assert isinstance(p['source_health'], list)
          assert len(p['source_health']) >= 15

          news_observations = [row for row in p['incidents'] if row.get('source_kind') == 'news']
          news_summaries = [row for row in p['events'] if (row.get('metadata') or {}).get('news_summary')]
          if news_observations and not news_summaries:
              raise SystemExit('Live news observations were collected but no normalized news summaries were generated')
          print(f"news_observations={len(news_observations)} news_summaries={len(news_summaries)}")
          for row in news_summaries[:3]:
              summary = (row.get('metadata') or {}).get('news_summary', '')
              print(f"NEWS_SUMMARY {row.get('title')}: {summary[:180]}")

          errors = [s for s in p['source_health'] if s['status'] == 'error']
          print(f"events={len(p['events'])} observations={len(p['incidents'])} sources={len(p['source_health'])} errors={len(errors)}")
          for row in errors:
              print(f"SOURCE_ERROR {row['source']}: {row.get('error')}")
          status = {s['source']: s['status'] for s in p['source_health']}
          transit_ok = status.get('Halifax Transit GTFS-Realtime') == 'ok'
          hrfe_live_ok = status.get('Halifax Regional Fire & Emergency') == 'ok'
          hrfe_mirror_ok = status.get('HRFE incident mirror · Bluesky') == 'ok'
          failures = []
          if not (hrfe_live_ok or hrfe_mirror_ok):
              failures.append('near-real-time HRFE coverage (primary live feed and dedicated mirror both failed)')
          if not transit_ok:
              failures.append('Halifax Transit GTFS-Realtime')
          if failures:
              raise SystemExit(f"Critical source compatibility failed: {failures}")
          PY
