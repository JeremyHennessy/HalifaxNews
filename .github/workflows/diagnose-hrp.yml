name: Verify HRP live adapter

on:
  push:
    branches: [fix/hrp-live-parser]
    paths:
      - "hfxpulse/adapters/hrp.py"
      - "tests/**"
      - ".github/workflows/diagnose-hrp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify live HRP adapter
        run: |
          python - <<'PY'
          from hfxpulse.adapters.hrp import fetch

          result = fetch()
          health = result.health
          print('status:', health.status if health else None)
          print('records:', len(result.incidents))
          print('error:', health.error if health else None)
          assert health is not None
          assert health.status == 'ok', health.error
          assert len(result.incidents) > 0
          first = result.incidents[0]
          print('first_title:', first.title)
          print('first_reported_at:', first.reported_at)
          print('first_summary:', first.summary)
          print('first_url:', first.source_url)
          assert first.reported_at
          assert '/home/news/' in first.source_url
          PY
