name: Diagnose HRP live source

on:
  push:
    branches: [fix/hrp-live-parser]
    paths: [".github/workflows/diagnose-hrp.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect current HRP release-card ancestor
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = 'https://www.halifax.ca/home/news?category=25'
          r = requests.get(url, timeout=25, headers={'User-Agent':'HFXPulse/1.0 (+https://github.com/JeremyHennessy/HalifaxNews)'})
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')
          link = soup.select_one('a.c-news-updates__list-item-link[href*="/home/news/"]')
          assert link is not None
          print('link:', link.get('href'))
          print('title:', link.get_text(' ', strip=True))
          parent = link
          for depth in range(1, 8):
              parent = parent.parent
              if parent is None: break
              print('DEPTH', depth, 'tag=', parent.name, 'class=', parent.get('class'))
              print('text=', parent.get_text(' ', strip=True)[:1200])
              print('html=', str(parent)[:2200].replace('\n',' '))
          PY
